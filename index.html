<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay ₹200</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.0/dist/index.global.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>
    <div x-data="payApp()" class="relative flex min-h-screen items-center justify-center bg-white p-4">

      <!-- Main Action Button -->
      <a
        :href="genericUpi"
        @click="handlePaymentInitiation($event)"
        class="inline-flex items-center justify-center rounded-md bg-gray-900 px-6 py-3 text-base font-medium text-white transition-colors hover:bg-gray-700"
      >
        Pay &#8377;200 via UPI
      </a>

      <!-- UPI App Drawer Overlay -->
      <div
        x-show="showPayOptions"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center"
        style="display: none;"
      >
        <div class="w-full max-w-sm rounded-t-2xl bg-white p-6 shadow-lg sm:rounded-2xl">
          <h2 class="mb-4 text-lg font-semibold text-gray-900">Select UPI App</h2>

          <div class="space-y-3">
            <template x-for="app in specificApps" :key="app.name">
              <a
                :href="app.scheme"
                :class="app.color"
                class="flex w-full items-center justify-center rounded-md px-4 py-3 text-sm font-medium text-white"
                x-text="'Open with ' + app.name"
              ></a>
            </template>

            <!-- Fallback standard button inside overlay -->
            <a
              :href="genericUpi"
              class="flex w-full items-center justify-center rounded-md border border-gray-200 bg-white px-4 py-3 text-sm font-medium text-gray-900"
            >
              Other UPI App
            </a>
          </div>

          <button
            type="button"
            @click="showPayOptions = false"
            class="mt-6 w-full text-center text-sm text-gray-400 underline hover:text-gray-900"
          >
            Cancel
          </button>
        </div>
      </div>

    </div>

    <script>
      function payApp() {
        const pa = "Q138205743@ybl";
        const pn = "Kawnek Mart";
        const am = "200";
        const tn = "hehe";

        // Fixed: Centralizing parameters to fix the undefined runtime errors
        const params = `pa=${pa}&pn=${encodeURIComponent(pn)}&am=${am}&tn=${encodeURIComponent(tn)}`;

        return {
          showPayOptions: false,
          genericUpi: `upi://pay?${params}`,
          
          // Fixed: Changed package=String; to use the native view action layout for standard choosers
          androidIntent: `intent://pay?${params}#Intent;scheme=upi;action=android.intent.action.VIEW;end`,
          
          specificApps: [
            {
              name: "PhonePe",
              scheme: `phonepe://upi/pay?${params}`,
              color: "bg-purple-600",
            },
            {
              name: "Google Pay",
              scheme: `gpay://upi/pay?${params}`,
              color: "bg-blue-500",
            },
            {
              name: "Paytm",
              // Fixed: Correctly formatted native Android intent to bypass scanner screen on mobile web
              scheme: `intent://pay?${params}#Intent;scheme=upi;package=net.one97.paytm;end`,
              color: "bg-sky-600",
            },
          ],
          handlePaymentInitiation(e) {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            // On desktop or iOS, it opens the UI sheet immediately. On Android, it calls the intent system.
            if (/android/i.test(ua)) {
              e.currentTarget.href = this.androidIntent;
            } else {
              e.preventDefault();
              this.showPayOptions = true;
            }
          },
        };
      }
    </script>
  </body>
</html>
